<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akhmey Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-bar">
        <div class="logo-area">
            <span class="material-symbols-outlined">bolt</span>
            <h1>Akhmey Portal</h1>
        </div>
        <button id="themeToggle" class="icon-button" aria-label="Ganti Tema">
            <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
        </button>
    </header>

    <main class="main-container">
        <section class="hero">
            <h2>Selamat Datang</h2>
            <p>Eksplorasi sisi gelap dan terang hidup</p>
        </section>

        <div class="filter-container">
            <div class="search-box">
                <span class="material-symbols-outlined">search</span>
                <input type="text" id="searchInput" placeholder="Cari artikel...">
            </div>
        </div>

        <section class="blog-grid" id="blogGrid"></section>
    </main>

    <div class="modal-overlay" id="articleModal">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modalCategory" class="badge">Kategori</span>
                <button class="icon-button" id="closeModal">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <h2 id="modalTitle">Judul Artikel</h2>
            <p class="modal-date" id="modalDate">Tanggal</p>
            <div class="modal-body" id="modalContent"></div>
        </div>
    </div>

    <footer class="app-footer">
        <p>&copy; 2026 AkhmeyBlog. Dibuat dengan bantuan Gemini AI.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
