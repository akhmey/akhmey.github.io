<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazzlyn Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Material You Theme Tokens */
        :root {
            --md-sys-color-background: #121316;
            --md-sys-color-surface: #1a1b20;
            --md-sys-color-surface-container: #23242a;
            --md-sys-color-primary: #d0bcff;
            --md-sys-color-on-primary: #381e72;
            --md-sys-color-primary-container: #4f378b;
            --md-sys-color-on-primary-container: #eaddff;
            --md-sys-color-outline: #8e9099;
        }
        body { background-color: var(--md-sys-color-background); color: #e3e2e6; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-[#4f378b] selection:text-[#eaddff]">

    <!-- Material You Top App Bar -->
    <header class="sticky top-0 z-40 bg-[var(--md-sys-color-surface)]/90 backdrop-blur-md border-b border-white/5 py-3.5 px-4 sm:px-6 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="toggleMobileSidebar()" class="md:hidden text-[#d0bcff] p-2 rounded-full bg-[var(--md-sys-color-surface-container)] hover:bg-white/10 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="font-bold text-base tracking-wide text-[#e3e2e6] flex items-center gap-2">
                    <span class="w-8 h-8 rounded-full bg-[#4f378b] flex items-center justify-center text-sm shadow-inner">🌸</span> Jazzlyn Blog
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportStaticPage()" class="text-xs bg-[#23242a] hover:bg-white/10 text-[#d0bcff] px-3.5 py-2 rounded-full border border-white/10 transition font-medium flex items-center gap-1.5 shadow-sm">
                    <span>📥</span> <span class="hidden sm:inline">Download HTML</span>
                </button>
                <button onclick="toggleForm()" class="text-xs bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] hover:opacity-90 px-4 py-2 rounded-full transition font-semibold shadow-md flex items-center gap-1">
                    <span>➕</span> Tulis
                </button>
            </div>
        </div>
    </header>

    <div id="sidebarOverlay" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden md:hidden transition-opacity"></div>

    <!-- Material You Navigation Drawer (Mobile) -->
    <div id="mobileSidebar" class="fixed inset-y-0 left-0 w-80 bg-[var(--md-sys-color-surface)] border-r border-white/10 p-6 space-y-6 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out md:hidden overflow-y-auto shadow-2xl">
        <div class="flex justify-between items-center pb-2 border-b border-white/10">
            <h2 class="font-bold text-sm text-[#d0bcff]">🌸 Menu Navigasi</h2>
            <button onclick="toggleMobileSidebar()" class="text-white/70 hover:text-white p-1.5 rounded-full hover:bg-white/10">✕</button>
        </div>
        <div id="mobileSidebarContent" class="space-y-6"></div>
    </div>

    <!-- Main Content Grid -->
    <div class="max-w-5xl mx-auto w-full px-4 sm:px-6 py-8 flex-grow grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Articles Feed -->
        <main class="md:col-span-2 space-y-6">
            
            <!-- Material You Form Card -->
            <div id="postForm" class="hidden bg-[var(--md-sys-color-surface)] border border-white/10 p-6 rounded-3xl space-y-4 shadow-xl">
                <h2 class="font-bold text-sm text-[#d0bcff] tracking-wider flex items-center gap-2">
                    <span>✨</span> Buat Postingan Baru
                </h2>
                <input type="text" id="postTitle" placeholder="Judul artikel..." class="w-full bg-[var(--md-sys-color-surface-container)] border border-white/10 rounded-2xl px-4 py-3 text-sm text-[#e3e2e6] focus:outline-none focus:border-[#d0bcff] placeholder:text-white/30 transition">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="postCategory" placeholder="Kategori (Misal: Coding, Idol)" class="w-full bg-[var(--md-sys-color-surface-container)] border border-white/10 rounded-2xl px-4 py-2.5 text-xs text-[#e3e2e6] focus:outline-none focus:border-[#d0bcff] placeholder:text-white/30 transition">
                    
                    <label class="cursor-pointer bg-[var(--md-sys-color-surface-container)] text-[#d0bcff] hover:bg-white/10 px-4 py-2.5 rounded-2xl border border-white/10 transition text-xs font-medium text-center flex items-center justify-center gap-1.5">
                        <span>🖼️</span> Pilih Gambar HP
                        <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                    </label>
                </div>

                <div id="imagePreviewContainer" class="hidden relative">
                    <img id="imagePreview" src="" alt="Preview" class="w-full max-h-48 object-cover rounded-2xl border border-white/10">
                    <button onclick="clearImage()" class="absolute top-2 right-2 bg-black/70 text-white text-xs px-2.5 py-1.5 rounded-full hover:bg-rose-600 transition">Hapus</button>
                </div>
                <input type="hidden" id="postMedia" value="">

                <textarea id="postContent" rows="6" placeholder="Tulis isi artikel... (Support Markdown)" class="w-full bg-[var(--md-sys-color-surface-container)] border border-white/10 rounded-2xl px-4 py-3 text-sm text-[#e3e2e6] focus:outline-none focus:border-[#d0bcff] font-mono placeholder:text-white/30 transition"></textarea>
                
                <div class="flex justify-end space-x-3 pt-2">
                    <button onclick="toggleForm()" class="px-4 py-2 text-xs text-white/70 hover:text-white transition">Batal</button>
                    <button onclick="addPost()" class="px-5 py-2.5 bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] rounded-full text-xs font-semibold shadow-md hover:opacity-90 transition">Publish Post</button>
                </div>
            </div>

            <div id="filterInfo" class="hidden justify-between items-center bg-[var(--md-sys-color-surface-container)] border border-white/10 px-4 py-3 rounded-2xl text-xs text-[#d0bcff]">
                <span id="filterText">Menampilkan hasil</span>
                <button onclick="clearFilter()" class="font-bold hover:underline">Reset ✕</button>
            </div>

            <section id="articleList" class="space-y-6"></section>
        </main>

        <!-- Material You Sidebar -->
        <aside id="desktopSidebar" class="hidden md:block space-y-6"></aside>
    </div>

    <footer class="border-t border-white/5 py-6 text-center text-xs text-white/40 mt-auto">
        <p>&copy; 2026 • Jazzlyn Blog • Material You Edition</p>
    </footer>

    <script>
        let posts = JSON.parse(localStorage.getItem('jazzlyn_static_posts')) || [
            {
                id: 1,
                title: "Selamat Datang di Jazzlyn Blog M3!",
                category: "Pengumuman",
                content: "Tampilan blog sudah diperbarui menjadi ala Material You yang bersih dan estetik. Silakan coba buat artikel baru!",
                media: "",
                date: "9 Agustus 2026"
            }
        ];

        let activeFilter = null;
        let searchQuery = "";
        let uploadedImageBase64 = "";

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    document.getElementById('postMedia').value = uploadedImageBase64;
                    document.getElementById('imagePreview').src = uploadedImageBase64;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function clearImage() {
            uploadedImageBase64 = "";
            document.getElementById('postMedia').value = "";
            document.getElementById('imagePreview').src = "";
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imageInput').value = "";
        }

        function renderBlog() {
            renderPosts();
            renderSidebarWidgets();
            localStorage.setItem('jazzlyn_static_posts', JSON.stringify(posts));
        }

        function renderPosts() {
            const container = document.getElementById('articleList');
            container.innerHTML = '';
            
            let filtered = posts.filter(post => {
                const matchSearch = post.title.toLowerCase().includes(searchQuery.toLowerCase()) || post.content.toLowerCase().includes(searchQuery.toLowerCase());
                const matchCategory = activeFilter ? post.category === activeFilter : true;
                return matchSearch && matchCategory;
            });

            const filterInfo = document.getElementById('filterInfo');
            if(activeFilter || searchQuery) {
                filterInfo.classList.remove('hidden');
                filterInfo.classList.add('flex');
                document.getElementById('filterText').innerText = `Filter: ${activeFilter ? '['+activeFilter+']' : ''} ${searchQuery ? '"'+searchQuery+'"' : ''} (${filtered.length})`;
            } else {
                filterInfo.classList.remove('flex');
                filterInfo.classList.add('hidden');
            }

            if(filtered.length === 0) {
                container.innerHTML = `<div class="bg-[var(--md-sys-color-surface)] border border-white/10 p-8 rounded-3xl text-center text-white/50 text-sm">Belum ada artikel.</div>`;
                return;
            }

            filtered.forEach((post) => {
                const parsedContent = marked.parse(post.content);
                let mediaHtml = post.media ? `<img src="${post.media}" alt="Media" class="w-full rounded-2xl mt-4 max-h-96 object-cover border border-white/10 shadow-md">` : '';

                container.innerHTML += `
                    <article class="bg-[var(--md-sys-color-surface)] border border-white/10 hover:border-white/20 transition p-6 rounded-3xl shadow-lg space-y-4">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-white/50">${post.date}</span>
                            <button onclick="filterByCategory('${post.category}')" class="bg-[var(--md-sys-color-primary-container)] text-[var(--md-sys-color-on-primary-container)] px-3 py-1 rounded-full font-medium transition">${post.category || 'Umum'}</button>
                        </div>
                        <h3 class="text-xl sm:text-2xl font-bold text-[#e3e2e6] tracking-wide">${post.title}</h3>
                        <div class="text-[#c7c6ca] text-sm leading-relaxed space-y-2">${parsedContent}</div>
                        ${mediaHtml}
                        <div class="pt-3 border-t border-white/5 flex justify-end">
                            <button onclick="deletePost(${post.id})" class="text-xs text-rose-400 hover:text-rose-300">Hapus Artikel</button>
                        </div>
                    </article>
                `;
            });
        }

        function getSidebarHTML() {
            const categories = [...new Set(posts.map(p => p.category || 'Umum'))];
            let catButtons = '';
            categories.forEach(cat => {
                catButtons += `<button onclick="filterByCategory('${cat}'); toggleMobileSidebar();" class="text-xs bg-[var(--md-sys-color-surface-container)] hover:bg-white/10 text-[#d0bcff] px-3.5 py-1.5 rounded-full border border-white/5 transition">${cat}</button>`;
            });

            let recentList = '';
            posts.slice(0, 5).forEach(p => {
                recentList += `<div class="truncate text-white/70 hover:text-white cursor-pointer" onclick="scrollToTop(); toggleMobileSidebar();">• ${p.title}</div>`;
            });

            return `
                <div class="bg-[var(--md-sys-color-surface)] border border-white/10 p-5 rounded-3xl shadow-md space-y-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-[#d0bcff]">🔍 Cari Artikel</h3>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Ketik kata kunci..." class="w-full bg-[var(--md-sys-color-surface-container)] border border-white/10 rounded-2xl px-3.5 py-2 text-xs text-[#e3e2e6] focus:outline-none focus:border-[#d0bcff] placeholder:text-white/30">
                </div>
                <div class="bg-[var(--md-sys-color-surface)] border border-white/10 p-5 rounded-3xl shadow-md space-y-3 text-center">
                    <div class="w-14 h-14 bg-[var(--md-sys-color-primary-container)] text-[var(--md-sys-color-on-primary-container)] rounded-full mx-auto flex items-center text-xl shadow-inner justify-center">🌸</div>
                    <h3 class="font-bold text-sm text-[#e3e2e6]">Jazzlyn / Wota Dev</h3>
                    <p class="text-xs text-white/60 leading-relaxed">Catatan harian & eksperimen web.</p>
                    <div class="pt-2 border-t border-white/5 flex justify-around text-xs text-white/70">
                        <div><span class="block font-bold text-[#e3e2e6] text-sm">${posts.length}</span>Post</div>
                        <div><span class="block font-bold text-[#e3e2e6] text-sm">${categories.length}</span>Kategori</div>
                    </div>
                </div>
                <div class="bg-[var(--md-sys-color-surface)] border border-white/10 p-5 rounded-3xl shadow-md space-y-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-[#d0bcff]">📂 Kategori</h3>
                    <div class="flex flex-wrap gap-2">${catButtons}</div>
                </div>
                <div class="bg-[var(--md-sys-color-surface)] border border-white/10 p-5 rounded-3xl shadow-md space-y-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-[#d0bcff]">⚡ Terbaru</h3>
                    <div class="space-y-2 text-xs">${recentList || '<span class="text-white/30">Belum ada post</span>'}</div>
                </div>
            `;
        }

        function renderSidebarWidgets() {
            const desktopSide = document.getElementById('desktopSidebar');
            if(desktopSide) desktopSide.innerHTML = getSidebarHTML();
            const mobileSide = document.getElementById('mobileSidebarContent');
            if(mobileSide) mobileSide.innerHTML = getSidebarHTML();
        }

        function toggleForm() {
            document.getElementById('postForm').classList.toggle('hidden');
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('mobileSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function addPost() {
            const title = document.getElementById('postTitle').value.trim();
            const category = document.getElementById('postCategory').value.trim() || 'Umum';
            const content = document.getElementById('postContent').value.trim();
            const media = document.getElementById('postMedia').value.trim();

            if(!title || !content) {
                alert('Judul dan isi artikel wajib diisi!');
                return;
            }

            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            const date = new Date().toLocaleDateString('id-ID', options);

            const newPost = { id: Date.now(), title, category, content, media, date };
            posts.unshift(newPost);
            
            document.getElementById('postTitle').value = '';
            document.getElementById('postCategory').value = '';
            document.getElementById('postContent').value = '';
            clearImage();
            toggleForm();
            renderBlog();
            alert("✨ Artikel berhasil ditambahkan! Jangan lupa klik 'Download HTML' untuk update web-nya.");
        }

        function deletePost(id) {
            if(confirm('Yakin ingin menghapus artikel ini?')) {
                posts = posts.filter(p => p.id !== id);
                renderBlog();
                alert("🗑️ Artikel dihapus! Jangan lupa download ulang file HTML-nya.");
            }
        }

        function exportStaticPage() {
            const clonedPostsData = JSON.stringify(posts);
            let htmlContent = document.documentElement.outerHTML;
            htmlContent = htmlContent.replace(/let posts = JSON\.parse\(localStorage\.getItem\('jazzlyn_static_posts'\)\) \|\| \[[\s\S]*?\];/, `let posts = ${clonedPostsData};`);

            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            a.remove();
            
            alert("📥 File 'index.html' berhasil di-download! Timpa file ini ke folder repo Termux lu, lalu `git push`!");
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value || '';
            renderPosts();
        }

        function filterByCategory(cat) {
            activeFilter = cat;
            renderPosts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearFilter() {
            activeFilter = null;
            searchQuery = "";
            renderPosts();
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderBlog();
    </script>
</body>
</html>
